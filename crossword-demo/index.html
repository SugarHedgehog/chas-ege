<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Демонстрация: здания на сетке 12×16</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --cell-size: 30px; /* размер клетки в пикселях */
      --grid-color: #e0e0e0;
      --sector-color: #888;
      --building-fill: #4caf50;
      --building-stroke: #2e7d32;
      --label-fill: #1a1a1a;
      --label-stroke: #ffffff;
    }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 16px;
      background: #fafafa;
      color: #222;
    }
    .wrap {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      align-items: start;
    }
    .panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 220px;
    }
    canvas {
      background: white;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      border-radius: 6px;
    }
    pre {
      background: #fff;
      border: 1px solid #ddd;
      padding: 8px;
      border-radius: 4px;
      max-height: 300px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.3;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .controls input[type="number"] {
      width: 72px;
    }
    button {
      padding: 6px 12px;
      border: 1px solid #1976d2;
      background: #2196f3;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { filter: brightness(0.95); }
    label { display: inline-flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <h1>Здания на сетке 12×16</h1>
  <div class="wrap">
    <div class="panel">
      <div class="controls">
        <button id="regen">Перегенерировать</button>
        <label title="Здание занимает весь сектор">
          <input type="checkbox" id="fillSector" />
          Заполнять сектор
        </label>
      </div>
      <label title="Отступ здания от границ сектора в клетках">
        Отступ (клеток):
        <input type="number" id="margin" value="0" min="0" max="3" step="1" />
      </label>
      <label title="Минимальная ширина здания в клетках">
        Мин. ширина:
        <input type="number" id="minW" value="1" min="1" max="12" step="1" />
      </label>
      <label title="Минимальная высота здания в клетках">
        Мин. высота:
        <input type="number" id="minH" value="1" min="1" max="16" step="1" />
      </label>

      <h3>Координаты зданий</h3>
      <pre id="output"></pre>
    </div>

    <!-- Канвас рисуется с учетом DPR, CSS размер = 12*cell x 16*cell -->
    <canvas id="grid"></canvas>
  </div>

  <!-- Подключаем ваш файл с генерацией (из этой же папки) -->
  <script src="./test.js"></script>
  <script src="./render.js"></script>
</body>
</html>
